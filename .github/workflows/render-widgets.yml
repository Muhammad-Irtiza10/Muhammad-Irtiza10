name: Render profile widgets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Muhammad-Irtiza10
          output_path: ./trophy.svg
          theme: darkhub
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: update trophy.svg"
          git pull --rebase origin main
          git push

  activity-graph:
    needs: trophy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate activity-graph.svg
        uses: maurodesouza/github-readme-activity-graph-action@main
        with:
          username: Muhammad-Irtiza10
          output_path: ./activity-graph.svg
          options: |
            bg_color=0D1117
            color=B91C3C
            line=B91C3C
            point=c9d1d9
            area=true
            hide_border=true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit activity-graph.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: update activity-graph.svg"
          git pull --rebase origin main
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Muhammad-Irtiza10
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
